# One container per shop: separate process, separate cache, separate schedule.
# A shop that hangs, throttles you or breaks its markup cannot affect the others.
# Adding a shop = one YAML file + one block here.
#
# What persists between runs:
#   ./sites    - your shop configs, on the host (writable, so `init` works)
#   ./output   - the CSV/XML files, on the host
#   cache-*    - a named volume per shop, holding Scrapy's HTTP cache; this is
#                what lets the next day's run revalidate with 304s instead of
#                downloading every page again

x-shop: &shop
  build: .
  restart: "no"
  environment:
    SURFSCRAPE_CACHE_DIR: /data/httpcache

services:
  easy-surfshop:
    <<: *shop
    container_name: surfscrape-easy-surfshop
    volumes:
      - ./sites:/app/sites
      - ./output:/data/output
      - cache-easy-surfshop:/data/httpcache
    command: ["site", "easy-surfshop", "--format", "csv", "xml",
              "--out", "/data/output", "--timestamp"]

  recharge:
    <<: *shop
    container_name: surfscrape-recharge
    volumes:
      - ./sites:/app/sites
      - ./output:/data/output
      - cache-recharge:/data/httpcache
    command: ["site", "recharge", "--format", "csv", "xml",
              "--out", "/data/output", "--timestamp"]

volumes:
  cache-easy-surfshop:
  cache-recharge:
