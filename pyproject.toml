[project]
name = "surfscrape"
version = "0.1.0"
description = "Modular scraper that turns windsurf webshops into a normalised product table"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "price-parser>=0.3.4",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
browser = ["playwright>=1.44"]   # only needed for JS-rendered shops

[project.scripts]
surfscrape = "surfscrape.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surfscrape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
