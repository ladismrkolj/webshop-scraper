[project]
name = "surfscrape"
version = "0.2.0"
description = "Config-driven product extraction layer on top of Scrapy, for windsurf webshops"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.13",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "selectolax>=0.3.21",
    "price-parser>=0.3.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
browser = ["scrapy-playwright>=0.0.34"]   # only for JS-rendered shops

[project.scripts]
surfscrape = "surfscrape.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surfscrape*"]

[tool.setuptools.package-data]
surfscrape = ["../sites/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
