# Recharge (SI)
#
# UNVERIFIED SCAFFOLD - the build sandbox cannot reach this domain, so these
# patterns are conventional defaults, not observed facts. Replace this file
# with a generated one, which takes about ten seconds:
#
#   surfscrape init https://www.recharge.si --write
#   surfscrape verify recharge
#
name: recharge
base_url: https://www.recharge.si
platform: auto            # auto | shopify | woocommerce | html
currency: EUR
drop_breadcrumbs: [Domov, Home, Trgovina, Shop]

product_url_include:
  - "/izdelek/"           # WooCommerce Slovenian permalink base
  - "/product/"
  - "/products/"
product_url_exclude:
  - "/kosarica"
  - "/blagajna"
  - "/moj-racun"
  - "\\?add-to-cart="

# Only needed for whatever `surfscrape verify` reports as MISS.
selectors: {}

# Scrapy settings, applied when this shop runs alone.
settings:
  DOWNLOAD_DELAY: 0.75
